name: Backend CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -c requirements.lock -e ".[dev]"
      - name: Lint and format
        run: |
          python -m ruff format --check src tests tools
          python -m ruff check src tests tools
          python -m pip check
      - name: Validate production Compose
        run: docker compose --env-file .env.production.example config --quiet
      - name: Build production image
        run: docker build --pull --tag lumi-be:ci .

  deploy:
    if: >-
      vars.VPS_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: lumi-production
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ secrets.VPS_SSH_HOST }}
      VPS_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
    steps:
      - name: Configure pinned SSH host and deploy key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          [ -n "$VPS_HOST" ] || { echo "::error::Missing secret VPS_SSH_HOST" >&2; exit 1; }
          [ -n "$VPS_USER" ] || { echo "::error::Missing secret VPS_SSH_USER" >&2; exit 1; }
          [ -n "$SSH_PRIVATE_KEY" ] || { echo "::error::Missing secret VPS_SSH_PRIVATE_KEY" >&2; exit 1; }
          [ -n "$SSH_KNOWN_HOSTS" ] || { echo "::error::Missing secret VPS_KNOWN_HOSTS" >&2; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          host_lookup="$VPS_HOST"
          if [ "$VPS_PORT" != "22" ]; then host_lookup="[$VPS_HOST]:$VPS_PORT"; fi
          ssh-keygen -F "$host_lookup" -f ~/.ssh/known_hosts >/dev/null || {
            echo "::error::VPS_KNOWN_HOSTS has no entry matching VPS_SSH_HOST and VPS_SSH_PORT. Copy the verified server host public key using the configured SSH address." >&2
            exit 1
          }
      - name: Deploy main on VPS
        run: >-
          ssh -o BatchMode=yes -o IdentitiesOnly=yes
          -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts
          -i ~/.ssh/id_ed25519 -p "$VPS_PORT"
          "$VPS_USER@$VPS_HOST"
          'cd /opt/lumi-be && git checkout main && git pull --ff-only origin main && sh deploy.sh'
